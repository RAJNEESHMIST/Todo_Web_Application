<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Stay Productive</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-tasks"></i> Todo App</h1>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </header>

        <div class="todo-wrapper">
            <!-- Add Todo Section -->
            <div class="add-todo-section">
                <div class="input-group">
                    <input type="text" id="todoInput" placeholder="Add a new todo..." autocomplete="off">
                    <button class="add-btn" id="addBtn">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
                
                <div class="todo-options" id="todoOptions">
                    <div class="option-group">
                        <label for="prioritySelect">
                            <i class="fas fa-flag"></i> Priority:
                        </label>
                        <select id="prioritySelect">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    
                    <div class="option-group">
                        <label for="categorySelect">
                            <i class="fas fa-tag"></i> Category:
                        </label>
                        <select id="categorySelect">
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="shopping">Shopping</option>
                            <option value="health">Health</option>
                            <option value="other" selected>Other</option>
                        </select>
                    </div>
                    
                    <div class="option-group">
                        <label for="dueDateInput">
                            <i class="fas fa-calendar"></i> Due Date:
                        </label>
                        <input type="date" id="dueDateInput">
                    </div>
                </div>
            </div>

            <!-- Search and Filter Section -->
            <div class="search-filter-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search todos...">
                    <button class="clear-search" id="clearSearch" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                    <button class="filter-btn" data-filter="high-priority">High Priority</button>
                </div>
                
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="action-btn delete-completed-btn" id="deleteCompletedBtnTop">
                        <i class="fas fa-trash-alt"></i> Delete Completed
                    </button>
                    <button class="action-btn clear-all-btn" id="clearAllBtnTop">
                        <i class="fas fa-broom"></i> Clear All
                    </button>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat-card">
                    <span class="stat-number" id="totalTodos">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="activeTodos">0</span>
                    <span class="stat-label">Active</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="completedTodos">0</span>
                    <span class="stat-label">Completed</span>
                </div>
            </div>

            <!-- Todo List -->
            <div class="todo-list" id="todoList">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-clipboard-list"></i>
                    <p>No todos yet. Add one to get started!</p>
                </div>
            </div>

            <!-- Bulk Actions -->
            <div class="bulk-actions" id="bulkActions" style="display: none;">
                <button class="bulk-btn" id="deleteCompletedBtn">
                    <i class="fas fa-trash"></i> Delete Completed
                </button>
                <button class="bulk-btn" id="clearAllBtn">
                    <i class="fas fa-broom"></i> Clear All
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Todo Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Todo</h2>
                <button class="close-modal" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="text" id="editTodoInput" placeholder="Todo text...">
                <div class="modal-options">
                    <div class="option-group">
                        <label>Priority:</label>
                        <select id="editPrioritySelect">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>Category:</label>
                        <select id="editCategorySelect">
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="shopping">Shopping</option>
                            <option value="health">Health</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>Due Date:</label>
                        <input type="date" id="editDueDateInput">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" id="cancelEditBtn">Cancel</button>
                <button class="save-btn" id="saveEditBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
